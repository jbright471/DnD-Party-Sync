name: Arcane Ally automation pilot

on:
  pull_request:
    branches:
      - automation/arcane-ally-live-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcane-ally-automation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=1
